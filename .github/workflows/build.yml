      - name: Web2APK - Sign APK
        if: env.type == 'web2apk'
        run: |
          APK_PATH=$(find project/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Menandatangani Web2APK APK: $APK_PATH"
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK_PATH"
            echo "Verifikasi tanda tangan Web2APK:"
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner verify "$APK_PATH"
          else
            echo "APK Web2APK tidak ditemukan, skip signing"
          fi


      - name: Prepare Flutter project
        if: env.type == 'flutter'
        run: |
          rm -rf flutter-project
          mkdir -p flutter-project
          unzip -q flutter-project.zip -d flutter-project

          FIRST_DIR=$(find flutter-project -mindepth 1 -maxdepth 1 -type d | head -n 1)
          ROOT_FILES=$(find flutter-project -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ROOT_FILES" = "1" ] && [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/pubspec.yaml" ]; then
            TMP_DIR=$(mktemp -d)
            cp -R "$FIRST_DIR"/. "$TMP_DIR"/
            rm -rf flutter-project
            mkdir -p flutter-project
            cp -R "$TMP_DIR"/. flutter-project/
          fi

          if [ ! -f flutter-project/pubspec.yaml ]; then
            echo "pubspec.yaml tidak ditemukan"
            exit 1
          fi

      - name: Generate Flutter app icons
        if: env.type == 'flutter'
        run: |
          cd flutter-project
          MIPMAP_DIRS="mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi"

          convert_to_png() {
            local src="$1"
            local dst="$2"
            if [ -f "$src" ]; then
              echo "Converting $src to $dst"
              convert "$src" "$dst" 2>/dev/null && return 0 || return 1
            else
              return 1
            fi
          }

          for dir in $MIPMAP_DIRS; do
            RES_DIR="android/app/src/main/res/$dir"
            find "$RES_DIR" -maxdepth 1 -name "ic_launcher.*" ! -name "ic_launcher.png" -print0 | while IFS= read -r -d '' file; do
              echo "Found $file, converting to PNG"
              convert_to_png "$file" "$RES_DIR/ic_launcher.png" && rm -f "$file"
            done
            find "$RES_DIR" -maxdepth 1 -name "ic_launcher_round.*" ! -name "ic_launcher_round.png" -print0 | while IFS= read -r -d '' file; do
              echo "Found $file, converting to PNG"
              convert_to_png "$file" "$RES_DIR/ic_launcher_round.png" && rm -f "$file"
            done
          done

          NEEDS_REGEN=false
          for dir in $MIPMAP_DIRS; do
            PNG_FILE="android/app/src/main/res/$dir/ic_launcher.png"
            if [ ! -f "$PNG_FILE" ]; then
              NEEDS_REGEN=true
              break
            fi
            if ! file "$PNG_FILE" | grep -q PNG || ! identify "$PNG_FILE" &>/dev/null; then
              NEEDS_REGEN=true
              break
            fi
          done

          if [ "$NEEDS_REGEN" = false ]; then
            echo "✅ Icons already exist and valid, skipping."
            exit 0
          fi

          echo "⚠️ Icons missing or invalid. Attempting to fix..."

          CONVERT_SUCCESS=false
          for dir in $MIPMAP_DIRS; do
            PNG_FILE="android/app/src/main/res/$dir/ic_launcher.png"
            if [ -f "$PNG_FILE" ]; then
              if convert "$PNG_FILE" "$PNG_FILE" 2>/dev/null; then
                CONVERT_SUCCESS=true
              fi
            fi
          done

          if [ "$CONVERT_SUCCESS" = true ]; then
            ALL_VALID=true
            for dir in $MIPMAP_DIRS; do
              PNG_FILE="android/app/src/main/res/$dir/ic_launcher.png"
              if [ ! -f "$PNG_FILE" ] || ! file "$PNG_FILE" | grep -q PNG || ! identify "$PNG_FILE" &>/dev/null; then
                ALL_VALID=false
                break
              fi
            done
            if [ "$ALL_VALID" = true ]; then
              echo "✅ Icons repaired successfully."
              for dir in $MIPMAP_DIRS; do
                ROUND_FILE="android/app/src/main/res/$dir/ic_launcher_round.png"
                [ -f "$ROUND_FILE" ] && convert "$ROUND_FILE" "$ROUND_FILE" 2>/dev/null || true
              done
              exit 0
            fi
          fi

          echo "Regenerating icons from build-assets/..."

          for dir in $MIPMAP_DIRS; do
            rm -f android/app/src/main/res/$dir/ic_launcher.*
          done

          ICON_SRC=""
          for ext in png jpg jpeg webp bmp gif tiff; do
            if [ -f "../build-assets/icon.$ext" ]; then
              if [ "$ext" != "png" ]; then
                convert "../build-assets/icon.$ext" "../build-assets/icon_temp.png" && ICON_SRC="../build-assets/icon_temp.png"
              else
                ICON_SRC="../build-assets/icon.png"
              fi
              break
            fi
          done

          if [ -z "$ICON_SRC" ] || [ ! -f "$ICON_SRC" ]; then
            echo "⚠️ No valid icon found, creating default blue icon..."
            convert -size 512x512 xc:blue ../build-assets/icon.png
            ICON_SRC="../build-assets/icon.png"
          fi

          echo "Using icon source: $ICON_SRC"

          for dir in $MIPMAP_DIRS; do
            mkdir -p "android/app/src/main/res/$dir"
          done

          convert "$ICON_SRC" -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$ICON_SRC" -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$ICON_SRC" -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$ICON_SRC" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$ICON_SRC" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          for dir in $MIPMAP_DIRS; do
            cp "android/app/src/main/res/$dir/ic_launcher.png" \
               "android/app/src/main/res/$dir/ic_launcher_round.png"
          done

          echo "✅ Icons regenerated successfully."

      - name: Fix Flutter Android configuration
        if: env.type == 'flutter'
        run: |
          cd flutter-project/android/app
          cp ../../../release.keystore .

          if [ -f build.gradle ]; then
            sed -i 's/compileSdk [0-9]*/compileSdk 36/g' build.gradle
            sed -i 's/targetSdk [0-9]*/targetSdk 36/g' build.gradle
            sed -i 's|storeFile file(".*")|storeFile file("release.keystore")|g' build.gradle
            sed -i 's|storePassword ".*"|storePassword "password"|g' build.gradle
            sed -i 's|keyAlias ".*"|keyAlias "release"|g' build.gradle
            sed -i 's|keyPassword ".*"|keyPassword "password"|g' build.gradle
          elif [ -f build.gradle.kts ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' build.gradle.kts
            sed -i 's/targetSdk = [0-9]*/targetSdk = 36/g' build.gradle.kts
            sed -i 's|storeFile = file(".*")|storeFile = file("release.keystore")|g' build.gradle.kts
            sed -i 's|storeFile.set(file(".*"))|storeFile.set(file("release.keystore"))|g' build.gradle.kts
            sed -i 's|storePassword = ".*"|storePassword = "password"|g' build.gradle.kts
            sed -i 's|storePassword.set(".*")|storePassword.set("password")|g' build.gradle.kts
            sed -i 's|keyAlias = ".*"|keyAlias = "release"|g' build.gradle.kts
            sed -i 's|keyAlias.set(".*")|keyAlias.set("release")|g' build.gradle.kts
            sed -i 's|keyPassword = ".*"|keyPassword = "password"|g' build.gradle.kts
            sed -i 's|keyPassword.set(".*")|keyPassword.set("password")|g' build.gradle.kts
          else
            echo "Tidak ditemukan build.gradle atau build.gradle.kts"
            exit 1
          fi

      - name: Detect and set Gradle version for Flutter
        if: env.type == 'flutter'
        run: |
          cd flutter-project/android
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            GRADLE_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed -n 's/.*gradle-\([0-9.]*\)-.*/\1/p')
            echo "Detected required Gradle version from wrapper: $GRADLE_VERSION"
            CURRENT_GRADLE=$(gradle --version | grep "Gradle" | head -n1 | awk '{print $NF}' || echo "unknown")
            echo "Currently installed Gradle: $CURRENT_GRADLE"
            if [ -n "$GRADLE_VERSION" ] && [ "$GRADLE_VERSION" != "$CURRENT_GRADLE" ]; then
              echo "Installing Gradle $GRADLE_VERSION"
              source "$HOME/.sdkman/bin/sdkman-init.sh"
              yes | sdk install gradle $GRADLE_VERSION
              sdk use gradle $GRADLE_VERSION
              echo "✅ Gradle $GRADLE_VERSION installed and set."
            else
              echo "✅ Gradle version matches, skipping."
            fi
          else
            echo "No gradle-wrapper.properties found, using default gradle."
          fi

      - name: Detect Flutter version from pubspec
        if: env.type == 'flutter'
        id: flutter_detect
        shell: bash
        run: |
          set -e
          PUBSPEC="flutter-project/pubspec.yaml"

          SDK_LINE=$(grep -A2 '^environment:' "$PUBSPEC" | grep 'sdk:' | head -n1 | sed 's/.*sdk:[[:space:]]*//; s/["'\'']//g' || true)
          echo "Detected SDK constraint: $SDK_LINE"

          FLUTTER_VERSION="3.27.0"

          get_dart_version() {
            echo "$1" | grep -oE '[0-9]+\.[0-9]+' | head -n1
          }

          DART_VERSION=$(get_dart_version "$SDK_LINE")
          echo "Extracted Dart version: $DART_VERSION"

          if [ -n "$DART_VERSION" ]; then
            case "$DART_VERSION" in
              "3.15"*|"3.14"*|"3.13"*|"3.12"*|"3.11"*|"3.10"*|"3.9"*|"3.8"*) FLUTTER_VERSION="3.35.2" ;;
              "3.7"*) FLUTTER_VERSION="3.29.0" ;;
              "3.6"*) FLUTTER_VERSION="3.27.0" ;;
              "3.5"*) FLUTTER_VERSION="3.24.0" ;;
              "3.4"*) FLUTTER_VERSION="3.22.0" ;;
              "3.3"*) FLUTTER_VERSION="3.19.0" ;;
              "3.2"*) FLUTTER_VERSION="3.16.0" ;;
              "3.1"*) FLUTTER_VERSION="3.13.0" ;;
              "3.0"*) FLUTTER_VERSION="3.10.0" ;;
              *) FLUTTER_VERSION="3.27.0" ;;
            esac
          fi

          if grep -Eq 'webview_flutter:[[:space:]]*(\^|>=)?4\.(1[5-9]|[2-9][0-9])' "$PUBSPEC" || \
             grep -Eq 'webview_flutter:[[:space:]]*(\^|>=)?5\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi

          if grep -Eq 'geolocator:[[:space:]]*(\^|>=)?14\.' "$PUBSPEC" || \
             grep -Eq 'geolocator:[[:space:]]*(\^|>=)?15\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi

          if grep -Eq 'google_maps_flutter:[[:space:]]*(\^|>=)?2\.(1[0-9]|[2-9][0-9])' "$PUBSPEC" || \
             grep -Eq 'google_maps_flutter:[[:space:]]*(\^|>=)?3\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi

          if grep -Eq 'firebase_core:[[:space:]]*(\^|>=)?3\.' "$PUBSPEC" || \
             grep -Eq 'firebase_[a-z_]+:[[:space:]]*(\^|>=)?3\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi

          if grep -Eq 'flutter_local_notifications:[[:space:]]*(\^|>=)?17\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi

          if grep -Eq 'workmanager:[[:space:]]*(\^|>=)?0\.(6|[7-9])' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi

          if grep -Eq 'image_picker:[[:space:]]*(\^|>=)?1\.(2[0-9]|[3-9][0-9])' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi

          if grep -Eq 'file_picker:[[:space:]]*(\^|>=)?8\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi

          if grep -Eq 'permission_handler:[[:space:]]*(\^|>=)?12\.' "$PUBSPEC"; then
            FLUTTER_VERSION="3.35.2"
          fi

          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV
          echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT
          echo "Using Flutter $FLUTTER_VERSION"

      - name: Setup Flutter SDK
        if: env.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Flutter APK
        if: env.type == 'flutter'
        shell: bash
        run: |
          cd flutter-project

          echo "=== Flutter Version ==="
          flutter --version
          echo "========================"

          PUB_LOG="../pubget.log"
          BUILD_MODE="${{ env.build_type }}"
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          fix_code_issues() {
            echo "=== Auto-fixing code issues ==="
            local CHANGED=0

            if ! grep -q "^  http:" pubspec.yaml; then
              echo "Menambahkan dependency http ke pubspec.yaml"
              sed -i '/dependencies:/a \ \ http: ^1.2.0' pubspec.yaml
              CHANGED=1
            fi

            grep -rl "http\.[a-zA-Z]" lib/ --include="*.dart" 2>/dev/null | while IFS= read -r FILE; do
              if [ -f "$FILE" ] && ! grep -q "import.*http" "$FILE"; then
                echo "Menambahkan import http ke $FILE"
                sed -i '1i import \x27package:http/http.dart\x27 as http;' "$FILE"
                CHANGED=1
              fi
            done

            echo "$CHANGED" > /tmp/changed_flag
          }

          auto_fix_pubspec() {
            local FIXED=false
            echo "=== Auto-fixing pubspec.yaml ==="

            if grep -q "requires SDK version" "$PUB_LOG" || grep -q "requires Dart SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan SDK constraint"
              sed -i -E "s/sdk:[[:space:]]*['\"]?[\^>=]*3\.[0-9]+(\.[0-9]+)?['\"]?/sdk: \">=3.6.0 <4.0.0\"/g" pubspec.yaml || true
              sed -i -E "s/sdk:[[:space:]]*['\"]?[\^>=]*3\.[0-9]+['\"]?/sdk: \">=3.6.0 <4.0.0\"/g" pubspec.yaml || true
              FIXED=true
            fi

            if grep -q "webview_flutter" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan webview_flutter ke 4.13.0"
              sed -i -E "s/webview_flutter:[[:space:]]*['\"]?[^'\"]+['\"]?/webview_flutter: ^4.13.0/g" pubspec.yaml || true
              FIXED=true
            fi

            if grep -q "geolocator" "$PUB_LOG" && (grep -q "toARGB32" "$PUB_LOG" || grep -q "geolocator_android" "$PUB_LOG"); then
              echo "Fix: Menurunkan geolocator ke 13.0.4"
              sed -i -E "s/geolocator:[[:space:]]*['\"]?[^'\"]+['\"]?/geolocator: ^13.0.4/g" pubspec.yaml || true
              FIXED=true
            fi

            if grep -q "google_maps_flutter" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan google_maps_flutter"
              sed -i -E "s/google_maps_flutter:[[:space:]]*['\"]?[^'\"]+['\"]?/google_maps_flutter: ^2.9.0/g" pubspec.yaml || true
              FIXED=true
            fi

            if grep -q "permission_handler" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan permission_handler"
              sed -i -E "s/permission_handler:[[:space:]]*['\"]?[^'\"]+['\"]?/permission_handler: ^11.3.1/g" pubspec.yaml || true
              FIXED=true
            fi

            if grep -q "firebase_core" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan firebase_core"
              sed -i -E "s/firebase_core:[[:space:]]*['\"]?[^'\"]+['\"]?/firebase_core: ^2.32.0/g" pubspec.yaml || true
              sed -i -E "s/firebase_[a-z_]+:[[:space:]]*['\"]?[^'\"]+['\"]?/firebase_\1: ^2.32.0/g" pubspec.yaml || true
              FIXED=true
            fi

            if grep -q "file_picker" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan file_picker"
              sed -i -E "s/file_picker:[[:space:]]*['\"]?[^'\"]+['\"]?/file_picker: ^6.2.1/g" pubspec.yaml || true
              FIXED=true
            fi

            if grep -q "image_picker" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan image_picker"
              sed -i -E "s/image_picker:[[:space:]]*['\"]?[^'\"]+['\"]?/image_picker: ^1.1.2/g" pubspec.yaml || true
              FIXED=true
            fi

            if grep -q "flutter_local_notifications" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan flutter_local_notifications"
              sed -i -E "s/flutter_local_notifications:[[:space:]]*['\"]?[^'\"]+['\"]?/flutter_local_notifications: ^17.2.4/g" pubspec.yaml || true
              FIXED=true
            fi

            if grep -q "workmanager" "$PUB_LOG" && grep -q "requires SDK version" "$PUB_LOG"; then
              echo "Fix: Menurunkan workmanager"
              sed -i -E "s/workmanager:[[:space:]]*['\"]?[^'\"]+['\"]?/workmanager: ^0.5.2/g" pubspec.yaml || true
              FIXED=true
            fi

            if grep -q "overrides" "$PUB_LOG"; then
              echo "Fix: Menangani dependency overrides"
              sed -i '/^dependency_overrides:/,/^[^ ]/d' pubspec.yaml || true
              FIXED=true
            fi

            if [ "$FIXED" = true ]; then
              echo "✅ Pubspec telah di-fix"
              rm -f pubspec.lock
            else
              echo "ℹ️ Tidak ada perbaikan yang diperlukan"
            fi
          }

          try_pub_get() {
            flutter pub get 2>&1 | tee "$PUB_LOG"
            return ${PIPESTATUS[0]}
          }

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "=== Attempt $RETRY_COUNT of $MAX_RETRIES ==="

            if try_pub_get; then
              echo "✅ flutter pub get succeeded"

              set +e
              fix_code_issues
              set -e

              if [ -f /tmp/changed_flag ]; then
                CHANGED=$(cat /tmp/changed_flag)
                rm -f /tmp/changed_flag
              else
                CHANGED=0
              fi

              if [ $CHANGED -eq 1 ]; then
                echo "Kode telah diperbaiki, jalankan pub get lagi..."
                if ! flutter pub get; then
                  echo "❌ pub get gagal setelah perbaikan kode"
                  continue
                fi
              fi

              if [ "$BUILD_MODE" = "release" ]; then
                if flutter build apk --release; then
                  SUCCESS=true
                  echo "✅ Build successful!"
                  break
                else
                  echo "❌ Build failed, attempting to fix pubspec..."
                  auto_fix_pubspec
                  rm -rf build .dart_tool
                fi
              else
                if flutter build apk --debug; then
                  SUCCESS=true
                  echo "✅ Build successful!"
                  break
                else
                  echo "❌ Build failed, attempting to fix pubspec..."
                  auto_fix_pubspec
                  rm -rf build .dart_tool
                fi
              fi
            else
              echo "❌ flutter pub get failed, attempting to fix pubspec..."
              auto_fix_pubspec
              rm -f pubspec.lock
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Build failed after $MAX_RETRIES attempts"
            echo "Last pub get output:"
            cat "$PUB_LOG" || true
            exit 1
          fi

      - name: Verify Flutter APK signature
        if: env.type == 'flutter' && env.build_type == 'release'
        run: |
          APK_PATH=$(find flutter-project/build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Verifikasi tanda tangan Flutter Release:"
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)/apksigner verify "$APK_PATH"
          else
            echo "APK Flutter release tidak ditemukan"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            project/app/build/outputs/apk/release/*.apk
            flutter-project/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error