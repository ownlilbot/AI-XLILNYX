name: Build APK

on:
  push:
    branches:
      - build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies (ImageMagick, jq, unzip, curl)
        run: sudo apt-get update && sudo apt-get install -y imagemagick jq unzip curl

      - name: Install Gradle
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.9
          sdk use gradle 8.9
          gradle --version

      - name: Read build config
        id: config
        run: |
          if [ -f build-config.json ]; then
            echo "type=$(jq -r .type build-config.json)" >> $GITHUB_ENV
            echo "url=$(jq -r .url build-config.json)" >> $GITHUB_ENV
            echo "app_name=$(jq -r .app_name build-config.json)" >> $GITHUB_ENV
            echo "build_type=$(jq -r .build_type build-config.json)" >> $GITHUB_ENV
            echo "=== build-config.json content ==="
            cat build-config.json
            echo "================================"
            echo "URL extracted: ${{ env.url }}"
          else
            echo "type=unknown" >> $GITHUB_ENV
            echo "⚠️ build-config.json not found!"
          fi

      - name: Generate keystore for signing
        run: |
          keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=BuildBot, OU=Dev, O=BuildBot, L=City, S=State, C=ID"


      - name: Web2APK - Create root gradle files
        if: env.type == 'web2apk'
        run: |
          mkdir -p project
          cat > project/build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.7.3'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat > project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyApp"
          include ':app'
          EOF

          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Web2APK - Create app/build.gradle
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app
          cat > project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.web2apk.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.web2apk.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
                  release {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.debug }
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.webkit:webkit:1.4.0'
          }
          EOF

      - name: Web2APK - Create MainActivity.java
        if: env.type == 'web2apk'
        run: |
          mkdir -p project/app/src/main/java/com/web2apk/app
          cat > project/app/src/main/java/com/web2apk/app/MainActivity.java <<'EOF'
          package com.web2apk.app;

          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.MimeTypeMap;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.URLUtil;
          import android.widget.ProgressBar;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.widget.Toolbar;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

          import java.io.File;
          import java.util.HashSet;
          import java.util.Set;

          public class MainActivity extends AppCompatActivity {

              private static final String WEBSITE_URL = "URL_PLACEHOLDER";

              private WebView webView;
              private ProgressBar progressBar;
              private SwipeRefreshLayout swipeRefreshLayout;
              private final Set<String> downloadingUrls = new HashSet<>();

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);
                  swipeRefreshLayout = findViewById(R.id.swipeRefreshLayout);

                  Toolbar toolbar = findViewById(R.id.toolbar);
                  setSupportActionBar(toolbar);

                  if (getSupportActionBar() != null) {
                      getSupportActionBar().setTitle(getString(R.string.app_name));
                  }

                  setupWebView();
                  swipeRefreshLayout.setOnRefreshListener(() -> webView.reload());

                  String url = WEBSITE_URL;
                  if (url == null || url.trim().isEmpty()) {
                      url = "about:blank";
                  }
                  webView.loadUrl(url);
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void setupWebView() {
                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  }
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      cookieManager.setAcceptThirdPartyCookies(webView, true);
                  }

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                          swipeRefreshLayout.setRefreshing(false);
                      }

                      @SuppressWarnings("deprecation")
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleUrl(url);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl().toString());
                      }

                      private boolean handleUrl(String url) {
                          if (url == null || url.trim().isEmpty()) return false;

                          String lowerUrl = url.toLowerCase();

                          if (lowerUrl.startsWith("intent:")) {
                              try {
                                  Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                                  try {
                                      startActivity(intent);
                                  } catch (Exception ignored) {
                                      String fallbackUrl = intent.getStringExtra("browser_fallback_url");
                                      if (fallbackUrl != null && !fallbackUrl.isEmpty()) {
                                          webView.loadUrl(fallbackUrl);
                                      }
                                  }
                              } catch (Exception ignored) {}
                              return true;
                          }

                          if (lowerUrl.startsWith("tel:")) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_DIAL, Uri.parse(url)));
                              } catch (Exception ignored) {}
                              return true;
                          }

                          if (lowerUrl.startsWith("mailto:")) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_SENDTO, Uri.parse(url)));
                              } catch (Exception ignored) {}
                              return true;
                          }

                          if (lowerUrl.startsWith("whatsapp:")) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              } catch (Exception ignored) {}
                              return true;
                          }

                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int progress) {
                          progressBar.setProgress(progress);
                          if (progress >= 100) {
                              progressBar.setVisibility(View.GONE);
                          } else {
                              progressBar.setVisibility(View.VISIBLE);
                          }
                      }
                  });

                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition,
                                                  String mimetype, long contentLength) {
                          startDownload(url, userAgent, contentDisposition, mimetype, contentLength);
                      }
                  });

                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
              }

              private boolean isDownloadInProgress(String url) {
                  DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                  if (dm == null) return false;

                  DownloadManager.Query query = new DownloadManager.Query();
                  query.setFilterByStatus(DownloadManager.STATUS_RUNNING |
                                          DownloadManager.STATUS_PENDING |
                                          DownloadManager.STATUS_PAUSED);

                  Cursor cursor = dm.query(query);
                  if (cursor != null) {
                      try {
                          int uriIndex = cursor.getColumnIndex(DownloadManager.COLUMN_URI);
                          if (uriIndex >= 0) {
                              while (cursor.moveToNext()) {
                                  String uri = cursor.getString(uriIndex);
                                  if (uri != null && uri.equals(url)) {
                                      return true;
                                  }
                              }
                          }
                      } finally {
                          cursor.close();
                      }
                  }
                  return false;
              }

              private String getExtensionFromMimeType(String mimeType) {
                  if (mimeType == null || mimeType.trim().isEmpty()) return "";

                  String cleanMimeType = mimeType.toLowerCase().split(";")[0].trim();
                  MimeTypeMap mimeMap = MimeTypeMap.getSingleton();
                  String ext = mimeMap.getExtensionFromMimeType(cleanMimeType);

                  if (ext != null && !ext.isEmpty()) {
                      return "." + ext;
                  }

                  switch (cleanMimeType) {
                      case "video/mp4": return ".mp4";
                      case "video/x-matroska": return ".mkv";
                      case "video/webm": return ".webm";
                      case "video/x-msvideo": return ".avi";
                      case "video/quicktime": return ".mov";
                      case "audio/mpeg": return ".mp3";
                      case "audio/mp4": return ".m4a";
                      case "audio/wav":
                      case "audio/x-wav": return ".wav";
                      case "audio/flac": return ".flac";
                      case "image/jpeg": return ".jpg";
                      case "image/png": return ".png";
                      case "image/gif": return ".gif";
                      case "image/webp": return ".webp";
                      case "image/bmp": return ".bmp";
                      case "application/pdf": return ".pdf";
                      case "application/zip": return ".zip";
                      case "application/x-rar-compressed": return ".rar";
                      case "application/x-7z-compressed": return ".7z";
                      case "application/gzip": return ".gz";
                      case "text/plain": return ".txt";
                      case "text/csv": return ".csv";
                      case "application/json": return ".json";
                      case "application/xml":
                      case "text/xml": return ".xml";
                      case "application/vnd.android.package-archive": return ".apk";
                      default: return "";
                  }
              }

              private String getExtensionFromUrl(String url) {
                  if (url == null || url.trim().isEmpty()) return "";

                  try {
                      Uri uri = Uri.parse(url);
                      String path = uri.getPath();
                      if (path == null || path.isEmpty()) return "";

                      int slash = path.lastIndexOf('/');
                      String fileName = slash >= 0 ? path.substring(slash + 1) : path;
                      int dot = fileName.lastIndexOf('.');

                      if (dot > 0 && dot < fileName.length() - 1) {
                          String extension = fileName.substring(dot);
                          if (extension.length() <= 15) {
                              return extension;
                          }
                      }
                  } catch (Exception ignored) {}
                  return "";
              }

              private String sanitizeFileName(String fileName) {
                  if (fileName == null || fileName.trim().isEmpty()) {
                      return "download";
                  }

                  fileName = fileName.trim().replaceAll("[\\\\/:*?\"<>|]", "_");

                  if (fileName.length() > 240) {
                      String extension = "";
                      int dot = fileName.lastIndexOf('.');
                      if (dot > 0) {
                          extension = fileName.substring(dot);
                      }
                      int maxBaseLength = 240 - extension.length();
                      if (maxBaseLength > 0) {
                          fileName = fileName.substring(0, Math.min(maxBaseLength, dot > 0 ? dot : fileName.length())) + extension;
                      }
                  }

                  return fileName;
              }

              private void startDownload(String url, String userAgent, String contentDisposition,
                                         String mimetype, long contentLength) {
                  if (url == null || url.trim().isEmpty()) return;

                  if (downloadingUrls.contains(url)) return;
                  if (isDownloadInProgress(url)) return;

                  downloadingUrls.add(url);

                  try {
                      String fileName = URLUtil.guessFileName(url, contentDisposition, mimetype);

                      if (fileName == null || fileName.trim().isEmpty() || fileName.equals("downloadfile")) {
                          try {
                              Uri uri = Uri.parse(url);
                              String lastPath = uri.getLastPathSegment();
                              if (lastPath != null && !lastPath.isEmpty()) {
                                  fileName = lastPath;
                              }
                          } catch (Exception ignored) {}
                      }

                      if (fileName == null || fileName.trim().isEmpty()) {
                          fileName = "download";
                      }

                      try {
                          fileName = Uri.decode(fileName);
                      } catch (Exception ignored) {}

                      fileName = sanitizeFileName(fileName);

                      boolean hasExtension = false;
                      int dotIndex = fileName.lastIndexOf('.');
                      if (dotIndex > 0 && dotIndex < fileName.length() - 1) {
                          hasExtension = true;
                      }

                      String urlExtension = getExtensionFromUrl(url);

                      if (!hasExtension) {
                          String mimeExtension = getExtensionFromMimeType(mimetype);
                          if (mimeExtension != null && !mimeExtension.isEmpty()) {
                              fileName += mimeExtension;
                          } else if (urlExtension != null && !urlExtension.isEmpty()) {
                              fileName += urlExtension;
                          }
                      }

                      String baseName = fileName;
                      String extension = "";
                      int finalDotIndex = fileName.lastIndexOf('.');
                      if (finalDotIndex > 0 && finalDotIndex < fileName.length() - 1) {
                          baseName = fileName.substring(0, finalDotIndex);
                          extension = fileName.substring(finalDotIndex);
                      }

                      File downloadDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (downloadDir != null) {
                          if (!downloadDir.exists()) {
                              downloadDir.mkdirs();
                          }

                          File file = new File(downloadDir, fileName);
                          int counter = 1;
                          while (file.exists()) {
                              String newName = baseName + "_" + counter + extension;
                              file = new File(downloadDir, newName);
                              counter++;
                          }
                          fileName = file.getName();
                      } else {
                          fileName = baseName + "_" + System.currentTimeMillis() + extension;
                      }

                      DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));

                      String finalMimeType = mimetype;
                      if (finalMimeType == null || finalMimeType.trim().isEmpty()) {
                          String ext = getExtensionFromUrl(url);
                          if (ext.isEmpty()) {
                              int dot = fileName.lastIndexOf('.');
                              if (dot >= 0 && dot < fileName.length() - 1) {
                                  ext = fileName.substring(dot);
                              }
                          }
                          if (!ext.isEmpty()) {
                              String cleanExtension = ext.replace(".", "").toLowerCase();
                              finalMimeType = MimeTypeMap.getSingleton().getMimeTypeFromExtension(cleanExtension);
                          }
                      }

                      if (finalMimeType == null || finalMimeType.trim().isEmpty()) {
                          finalMimeType = "application/octet-stream";
                      }
                      request.setMimeType(finalMimeType);

                      if (userAgent != null && !userAgent.trim().isEmpty()) {
                          request.addRequestHeader("User-Agent", userAgent);
                      } else {
                          request.addRequestHeader("User-Agent", webView.getSettings().getUserAgentString());
                      }

                      String cookie = CookieManager.getInstance().getCookie(url);
                      if (cookie != null && !cookie.isEmpty()) {
                          request.addRequestHeader("Cookie", cookie);
                      }

                      String currentUrl = webView.getUrl();
                      if (currentUrl != null && !currentUrl.isEmpty()) {
                          request.addRequestHeader("Referer", currentUrl);
                      }

                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);

                      DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                      if (dm != null) {
                          dm.enqueue(request);
                          Toast.makeText(this, "Download started: " + fileName, Toast.LENGTH_SHORT).show();
                      } else {
                          Toast.makeText(this, "Download Manager unavailable", Toast.LENGTH_SHORT).show();
                      }

                  } catch (Exception e) {
                      Toast.makeText(this, "Download failed: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  } finally {
                      downloadingUrls.remove(url);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                      return;
                  }
                  super.onBackPressed();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) webView.onResume();
              }

              @Override
              protected void onPause() {
                  if (webView != null) webView.onPause();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.setWebChromeClient(null);
                      webView.setWebViewClient(null);
                      webView.setDownloadListener(null);
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Web2APK - Create SplashActivity.java
        if: env.type == 'web2apk'
        run: |
          cat > project/app/src/main/java/com/web2apk/app/SplashActivity.java <<'EOF'
          package com.web2apk.app;

          import android.animation.Animator;
          import android.animation.AnimatorListenerAdapter;
          import android.animation.ValueAnimator;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.animation.LinearInterpolator;
          import android.widget.ImageView;
          import android.widget.TextView;

          import androidx.appcompat.app.AppCompatActivity;

          import java.util.Random;

          public class SplashActivity extends AppCompatActivity {

              private ImageView splashLogo;
              private TextView buildText, thanksText, loadingText;

              private View bar1, bar2, bar3, bar4, bar5;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Random random = new Random();

              private static final String RANDOM_CHARS =
                      "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

              private boolean destroyed = false;

              

              private ValueAnimator waveAnimator;

              // Tinggi minimum bar
              private static final float BAR_MIN_SCALE = 0.35f;

              // Tinggi maksimum bar
              private static final float BAR_MAX_SCALE = 1.0f;

              // Jarak fase antar bar.
              // Semakin besar = gelombang semakin panjang.
              private static final float BAR_PHASE_DELAY = 0.16f;

              // Kecepatan satu gelombang.
              // Semakin besar = semakin lambat.
              private static final long WAVE_DURATION = 1200L;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setContentView(R.layout.activity_splash);

                  splashLogo = findViewById(R.id.splashLogo);

                  buildText = findViewById(R.id.buildText);
                  thanksText = findViewById(R.id.thanksText);
                  loadingText = findViewById(R.id.loadingText);

                  bar1 = findViewById(R.id.bar1);
                  bar2 = findViewById(R.id.bar2);
                  bar3 = findViewById(R.id.bar3);
                  bar4 = findViewById(R.id.bar4);
                  bar5 = findViewById(R.id.bar5);

                  

                  buildText.setText("");

                  thanksText.setText("");
                  thanksText.setVisibility(View.INVISIBLE);

                  loadingText.setVisibility(View.INVISIBLE);

                  

                  animateLogo();

                  

                  startSmoothLoadingAnimation();

                  

                  handler.postDelayed(() -> {

                      scrambleText(
                              buildText,
                              "POWERED BY XSAT",
                              0,
                              () -> {

                                  handler.postDelayed(() -> {

                                      if (destroyed) return;

                                      thanksText.setVisibility(View.VISIBLE);

                                      fadeIn(thanksText);

                                      scrambleText(
                                              thanksText,
                                              "THANK YOU FOR USING WEB2APK XSAT",
                                              0,
                                              () -> {

                                                  handler.postDelayed(() -> {

                                                      if (destroyed) return;

                                                      loadingText.setVisibility(
                                                              View.VISIBLE
                                                      );

                                                      fadeIn(loadingText);

                                                  }, 150);

                                                  handler.postDelayed(() -> {

                                                      if (destroyed) return;

                                                      
                                                      stopWaveAnimation();

                                                      startActivity(
                                                              new Intent(
                                                                      SplashActivity.this,
                                                                      MainActivity.class
                                                              )
                                                      );

                                                      overridePendingTransition(
                                                              android.R.anim.fade_in,
                                                              android.R.anim.fade_out
                                                      );

                                                      finish();

                                                  }, 800);
                                              }
                                      );

                                  }, 250);
                              }
                      );

                  }, 500);
              }

              

              private void animateLogo() {

                  splashLogo.setAlpha(0f);

                  splashLogo.setScaleX(0.85f);
                  splashLogo.setScaleY(0.85f);

                  splashLogo.animate()
                          .alpha(1f)
                          .scaleX(1f)
                          .scaleY(1f)
                          .setDuration(750)
                          .setInterpolator(
                                  new android.view.animation.DecelerateInterpolator()
                          )
                          .start();
              }

              

              private void scrambleText(
                      TextView textView,
                      String target,
                      int position,
                      Runnable onComplete
              ) {

                  if (destroyed) return;

                  if (position >= target.length()) {

                      textView.setText(target);

                      if (onComplete != null) {
                          onComplete.run();
                      }

                      return;
                  }

                  if (target.charAt(position) == ' ') {

                      textView.setText(
                              createDisplayText(
                                      target,
                                      position,
                                      ' '
                              )
                      );

                      handler.postDelayed(
                              () -> scrambleText(
                                      textView,
                                      target,
                                      position + 1,
                                      onComplete
                              ),
                              55
                      );

                      return;
                  }

                  scrambleCharacter(
                          textView,
                          target,
                          position,
                          0,
                          onComplete
                  );
              }

              private void scrambleCharacter(
                      TextView textView,
                      String target,
                      int position,
                      int iteration,
                      Runnable onComplete
              ) {

                  if (destroyed) return;

                  if (iteration >= 6) {

                      textView.setText(
                              createDisplayText(
                                      target,
                                      position,
                                      target.charAt(position)
                              )
                      );

                      handler.postDelayed(
                              () -> scrambleText(
                                      textView,
                                      target,
                                      position + 1,
                                      onComplete
                              ),
                              25
                      );

                      return;
                  }

                  textView.setText(
                          createDisplayText(
                                  target,
                                  position,
                                  randomCharacter()
                          )
                  );

                  handler.postDelayed(
                          () -> scrambleCharacter(
                                  textView,
                                  target,
                                  position,
                                  iteration + 1,
                                  onComplete
                          ),
                          35
                  );
              }

              private String createDisplayText(
                      String target,
                      int position,
                      char currentChar
              ) {

                  StringBuilder sb = new StringBuilder();

                  for (int i = 0; i < target.length(); i++) {

                      if (i < position) {

                          sb.append(target.charAt(i));

                      } else if (i == position) {

                          sb.append(currentChar);

                      } else {

                          if (target.charAt(i) == ' ') {
                              sb.append(' ');
                          } else {
                              sb.append(randomCharacter());
                          }
                      }
                  }

                  return sb.toString();
              }

              private char randomCharacter() {

                  return RANDOM_CHARS.charAt(
                          random.nextInt(
                                  RANDOM_CHARS.length()
                          )
                  );
              }

              

              private void fadeIn(View view) {

                  view.setAlpha(0f);

                  view.animate()
                          .alpha(1f)
                          .setDuration(450)
                          .start();
              }

              

              private void startSmoothLoadingAnimation() {

                  final View[] bars = {
                          bar1,
                          bar2,
                          bar3,
                          bar4,
                          bar5
                  };

                  
                  for (View bar : bars) {

                      if (bar != null) {
                          bar.setScaleY(BAR_MIN_SCALE);
                      }
                  }

                  
                  waveAnimator = ValueAnimator.ofFloat(
                          0f,
                          1f
                  );

                  waveAnimator.setDuration(
                          WAVE_DURATION
                  );

                  
                  waveAnimator.setInterpolator(
                          new LinearInterpolator()
                  );

                  waveAnimator.setRepeatCount(
                          ValueAnimator.INFINITE
                  );

                  waveAnimator.setRepeatMode(
                          ValueAnimator.RESTART
                  );

                  waveAnimator.addUpdateListener(animation -> {

                      if (destroyed) return;

                      float progress =
                              (float) animation.getAnimatedValue();

                      
                      for (int i = 0; i < bars.length; i++) {

                          View bar = bars[i];

                          if (bar == null) continue;

                          
                          float phase =
                                  progress
                                  - (i * BAR_PHASE_DELAY);

                          
                          phase = phase % 1f;

                          if (phase < 0f) {
                              phase += 1f;
                          }

                          
                          double angle =
                                  phase * Math.PI * 2.0;

                          float wave =
                                  (float)
                                          ((Math.sin(angle - Math.PI / 2.0) + 1.0)
                                                  / 2.0);

                          
                          float scale =
                                  BAR_MIN_SCALE
                                  + (
                                          wave
                                          * (
                                                  BAR_MAX_SCALE
                                                  - BAR_MIN_SCALE
                                          )
                                  );

                          bar.setScaleY(scale);
                      }
                  });

                  waveAnimator.start();
              }

              

              private void stopWaveAnimation() {

                  if (waveAnimator != null) {

                      waveAnimator.cancel();

                      waveAnimator.removeAllUpdateListeners();

                      waveAnimator = null;
                  }
              }

              

              @Override
              protected void onDestroy() {

                  destroyed = true;

                  stopWaveAnimation();

                  handler.removeCallbacksAndMessages(null);

                  super.onDestroy();
              }
          }
          EOF

